<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#10b981" />
<title>下单员点单系统</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #10b981;
    --primary-dark: #0d9d6e;
    --danger: #ef4444;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --line: #eceef1;
    --radius: 16px;
    --shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  input { font-family: inherit; }

  .hidden { display: none !important; }

  /* ============ 登录页 ============ */
  #loginView {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, #10b981 0%, #0ea5e9 100%);
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: 24px;
    padding: 36px 28px 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
  }
  .login-title { font-size: 24px; font-weight: 700; text-align: center; }
  .login-sub { font-size: 14px; color: var(--text-2); text-align: center; margin: 8px 0 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    font-size: 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    outline: none;
    background: #fafbfc;
    transition: border-color .15s;
  }
  .form-group input:focus { border-color: var(--primary); background: #fff; }
  .login-error {
    color: var(--danger);
    font-size: 13px;
    text-align: center;
    margin: -4px 0 12px;
    min-height: 18px;
  }
  .login-btn {
    width: 100%;
    height: 50px;
    background: var(--primary);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    border-radius: 12px;
    transition: background .15s, transform .05s;
  }
  .login-btn:active { background: var(--primary-dark); transform: scale(.98); }

  /* ============ 主界面 ============ */
  #mainView {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar .logout {
    font-size: 13px;
    color: var(--text-2);
    background: #f1f2f4;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .topbar .logout:active { background: #e5e7eb; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  .category-area {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 16px;
    overflow-y: auto;
  }
  .category-card {
    flex: 1 1 0;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 16px 20px;
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
    text-align: left;
    transition: transform .06s;
  }
  .category-card:active { transform: scale(.98); }
  .category-card .cat-name { font-size: 20px; font-weight: 700; }
  .category-card .cat-sub { font-size: 13px; color: var(--text-2); margin-top: 6px; }
  .category-card .cat-count {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--primary);
    background: rgba(16, 185, 129, .12);
    padding: 3px 10px;
    border-radius: 20px;
    align-self: flex-start;
  }

  /* ============ 待确定订单 ============ */
  .pending-panel {
    flex-shrink: 0;
    max-height: 42%;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-top: 1px solid var(--line);
  }
  .pending-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .pending-head h2 { font-size: 15px; font-weight: 700; }
  .pending-clear {
    font-size: 13px;
    color: var(--text-2);
    background: #f1f2f4;
    padding: 6px 12px;
    border-radius: 8px;
  }
  .pending-clear:active { background: #e5e7eb; }
  .pending-list {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 14px 10px;
    overflow-y: auto;
    align-content: start;
    -webkit-overflow-scrolling: touch;
  }
  .pending-item {
    position: relative;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }
  .pending-item .pi-name { font-size: 13px; font-weight: 600; line-height: 1.3; word-break: break-all; }
  .pending-item .pi-remark {
    font-size: 11px;
    color: var(--primary);
    margin-top: 4px;
    line-height: 1.3;
    word-break: break-all;
  }
  .pending-item .pi-price { font-size: 13px; font-weight: 700; color: #f59e0b; margin-top: 4px; }
  .pending-item .pi-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fee2e2;
    color: #dc2626;
    font-size: 13px;
    line-height: 20px;
  }
  .pending-item .pi-remove:active { background: #fecaca; }
  .pending-footer { flex-shrink: 0; padding: 0 14px 14px; }
  .confirm-btn {
    width: 100%;
    height: 48px;
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border-radius: 12px;
    transition: background .15s, transform .05s;
  }
  .confirm-btn:active { background: var(--primary-dark); transform: scale(.98); }

  /* ============ 订单列表 ============ */
  .order-panel {
    flex-shrink: 0;
    max-height: 40%;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 20px rgba(15, 23, 42, 0.05);
    overflow: hidden;
  }
  .order-panel.expanded {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 80dvh;
    max-height: none;
    z-index: 90;
    border-radius: 20px 20px 0 0;
  }
  .order-mask {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    z-index: 89;
  }
  .collapse-btn {
    flex-shrink: 0;
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #f1f2f4;
    color: var(--text-2);
    font-size: 15px;
    font-weight: 600;
  }
  .collapse-btn:active { background: #e5e7eb; }
  .order-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
  }
  .order-head h2 { font-size: 16px; font-weight: 700; }
  .order-head-right { display: flex; align-items: center; gap: 8px; }
  .order-head .order-total { font-size: 13px; color: var(--text-2); }
  .expand-hint { font-size: 14px; color: var(--text-3); transition: transform .2s; }
  .order-list {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 14px 14px;
    overflow-y: auto;
    align-content: start;
    -webkit-overflow-scrolling: touch;
  }
  .order-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-3);
    font-size: 14px;
    padding: 28px 0;
  }
  .order-item {
    display: flex;
    flex-direction: column;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
  }
  .order-item:active { background: #f1f5f9; }
  .oi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .oi-seq {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    background: rgba(16, 185, 129, .12);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .oi-time { font-size: 11px; color: var(--text-3); }
  .oi-dish-list {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .oi-dish { font-size: 12px; line-height: 1.3; color: var(--text-2); }
  .oi-dish-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oi-remark {
    font-size: 10px;
    color: var(--primary);
    margin-top: 1px;
    word-break: break-all;
  }
  .oi-more { font-size: 11px; color: var(--primary); font-weight: 600; }
  .oi-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .oi-total { font-size: 14px; font-weight: 700; color: var(--primary); }
  .serve-btn {
    height: 30px;
    padding: 0 12px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    transition: background .15s, transform .05s;
  }
  .serve-btn:active { background: var(--primary-dark); transform: scale(.96); }

  /* ============ 订单详情弹窗 ============ */
  .detail-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 20px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .detail-dish {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .detail-dish:last-child { border-bottom: none; }
  .dd-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .detail-dish .dd-name { font-size: 15px; font-weight: 600; }
  .detail-dish .dd-remark { font-size: 12px; color: var(--primary); }
  .dd-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .detail-dish .dd-price { font-size: 14px; font-weight: 700; color: #f59e0b; }
  .dd-serve {
    height: 32px;
    padding: 0 14px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    transition: background .15s, transform .05s;
  }
  .dd-serve:active { background: var(--primary-dark); transform: scale(.96); }
  .detail-foot {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--line);
  }
  .detail-foot .df-total { font-size: 16px; font-weight: 700; color: var(--primary); }
  .detail-serve-btn {
    height: 44px;
    padding: 0 24px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
  }
  .detail-serve-btn:active { background: var(--primary-dark); }

  /* ============ 备注选择弹窗 ============ */
  .remark-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 20px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .remark-group { margin-top: 16px; }
  .remark-group:first-child { margin-top: 4px; }
  .remark-group-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-2);
    margin-bottom: 10px;
  }
  .remark-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    height: 38px;
    padding: 0 16px;
    background: #f1f2f4;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    border-radius: 20px;
    transition: background .12s, color .12s;
  }
  .chip:active { background: #e5e7eb; }
  .chip.active {
    background: rgba(16, 185, 129, .14);
    color: var(--primary);
    font-weight: 600;
  }
  .remark-footer {
    flex-shrink: 0;
    padding: 0 20px 20px;
  }

  /* ============ 总账本 ============ */
  .ledger-summary {
    flex-shrink: 0;
    display: flex;
    gap: 12px;
    padding: 8px 20px 16px;
  }
  .ledger-stat {
    flex: 1;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .ledger-stat .ls-value { font-size: 24px; font-weight: 800; color: var(--primary); word-break: break-all; }
  .ledger-stat .ls-label { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .ledger-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 20px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .ledger-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .ledger-item:last-child { border-bottom: none; }
  .li-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .li-seq {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    background: rgba(16, 185, 129, .12);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .li-time { flex: 1 1 auto; font-size: 13px; color: var(--text-2); }
  .li-amount { font-size: 15px; font-weight: 700; color: var(--primary); }
  .li-dishes {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.4;
    word-break: break-all;
  }
  .ledger-empty {
    text-align: center;
    color: var(--text-3);
    font-size: 14px;
    padding: 24px 0;
  }
  .ledger-footer {
    flex-shrink: 0;
    padding: 0 20px 20px;
  }
  .ledger-clear-btn {
    width: 100%;
    height: 44px;
    background: #fef2f2;
    color: var(--danger);
    font-size: 15px;
    font-weight: 600;
    border-radius: 12px;
    transition: background .15s, color .15s;
  }
  .ledger-clear-btn:active { background: #fee2e2; }
  .ledger-clear-btn.confirming {
    background: var(--danger);
    color: #fff;
  }

  /* ============ 菜品弹窗 ============ */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    align-items: flex-end;
    z-index: 100;
    animation: fadeIn .18s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    width: 100%;
    max-height: 78dvh;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    display: flex;
    flex-direction: column;
    animation: slideUp .22s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px;
  }
  .modal-head h3 { font-size: 18px; font-weight: 700; }
  .modal-close {
    width: 34px; height: 34px;
    background: #f1f2f4;
    color: var(--text-2);
    font-size: 18px;
    border-radius: 10px;
  }
  .modal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 4px 16px 20px;
    align-content: start;
    -webkit-overflow-scrolling: touch;
  }
  .group-head {
    grid-column: 1 / -1;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-2);
    margin-top: 8px;
    padding: 6px 0 2px;
    border-bottom: 1px solid var(--line);
  }
  .dish-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 8px;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  .dish-info { width: 100%; min-width: 0; }
  .dish-info .di-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-all;
  }
  .dish-info .di-desc {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dish-info .di-price { font-size: 14px; font-weight: 700; color: #f59e0b; margin-top: 4px; }
  .add-btn {
    width: 100%;
    height: 36px;
    background: rgba(16, 185, 129, .12);
    color: var(--primary);
    font-size: 14px;
    font-weight: 600;
    border-radius: 20px;
  }
  .add-btn:active { background: rgba(16, 185, 129, .22); }

  /* ============ 轻提示 ============ */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85);
    color: #fff;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 24px;
    z-index: 200;
    pointer-events: none;
    animation: fadeIn .18s;
  }
</style>
</head>
<body>

  <!-- 登录视图 -->
  <section id="loginView">
    <div class="login-card">
      <div class="login-title">下单员点单系统</div>
      <div class="login-sub">请登录后开始点单</div>
      <div class="form-group">
        <label for="accountInput">账号</label>
        <input id="accountInput" type="text" placeholder="你的名字缩写" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="passwordInput">密码</label>
        <input id="passwordInput" type="password" placeholder="4 位数生日为密码" autocomplete="off" />
      </div>
      <div id="loginError" class="login-error"></div>
      <button id="loginBtn" class="login-btn">登 录</button>
    </div>
  </section>

  <!-- 主界面 -->
  <section id="mainView" class="hidden">
    <header class="topbar">
      <h1>📋 点单台</h1>
      <div class="topbar-actions">
        <button id="ledgerBtn" class="logout">账本</button>
        <button id="logoutBtn" class="logout">退出登录</button>
      </div>
    </header>
    <div id="categoryArea" class="category-area"></div>

    <div id="orderMask" class="order-mask hidden"></div>

    <!-- 待确定订单 -->
    <div id="pendingPanel" class="pending-panel hidden">
      <div class="pending-head">
        <h2>🛒 待确定订单</h2>
        <button id="pendingClear" class="pending-clear">清空</button>
      </div>
      <div id="pendingList" class="pending-list"></div>
      <div class="pending-footer">
        <button id="confirmBtn" class="confirm-btn">确定下单</button>
      </div>
    </div>

    <!-- 订单列表 -->
    <div class="order-panel" id="orderPanel">
      <button id="collapseBtn" class="collapse-btn hidden">▾ 收起</button>
      <div class="order-head" id="orderHead">
        <h2>订单列表</h2>
        <div class="order-head-right">
          <span id="orderTotal" class="order-total"></span>
          <span id="expandHint" class="expand-hint">▲</span>
        </div>
      </div>
      <div id="orderList" class="order-list"></div>
    </div>
  </section>

  <!-- 菜品弹窗 -->
  <div id="dishModal" class="modal-mask hidden">
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="modal-close">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- 订单详情弹窗 -->
  <div id="orderDetailModal" class="modal-mask hidden">
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 id="orderDetailTitle"></h3>
        <button id="orderDetailClose" class="modal-close">✕</button>
      </div>
      <div id="orderDetailBody" class="detail-body"></div>
      <div class="detail-foot">
        <span id="orderDetailTotal" class="df-total"></span>
        <button id="orderDetailServe" class="detail-serve-btn">全部出餐</button>
      </div>
    </div>
  </div>

  <!-- 备注选择弹窗 -->
  <div id="remarkModal" class="modal-mask hidden">
    <div class="modal-sheet">
      <div class="modal-head">
        <h3 id="remarkTitle"></h3>
        <button id="remarkClose" class="modal-close">✕</button>
      </div>
      <div id="remarkBody" class="remark-body"></div>
      <div class="remark-footer">
        <button id="remarkConfirm" class="confirm-btn">确定加入</button>

      if (remarkGroups && remarkGroups.length) {
        openRemarkModal(dish, remarkGroups);
      } else {
        addToPending(dish, []);
      }
    });
    return item;

  function openDishModal(cat) {
    modalTitle.textContent = cat.icon + ' ' + cat.category;
    modalBody.innerHTML = '';

      cat.groups.forEach((g) => {
        const head = document.createElement('div');
        head.className = 'group-head';
        head.textContent = g.name;
        modalBody.appendChild(head);
        g.items.forEach((dish) => {
          modalBody.appendChild(buildDishItem(dish, cat.remarkGroups));
        });
      });
    } else if (cat.items) {
      cat.items.forEach((dish) => {
        modalBody.appendChild(buildDishItem(dish, cat.remarkGroups));
      });
    }
    dishModal.classList.remove('hidden');
  }

  /* ============ 备注选择弹窗 ============ */
  function openRemarkModal(dish, remarkGroups) {
    remarkTargetDish = dish;
    remarkSelection = {};
    remarkTitle.textContent = dish.name;
    remarkBody.innerHTML = '';
    remarkGroups.forEach((g) => {
      const grp = document.createElement('div');
      grp.className = 'remark-group';
      const gt = document.createElement('div');
      gt.className = 'remark-group-title';
      gt.textContent = g.title;
      grp.appendChild(gt);
      const chips = document.createElement('div');
      chips.className = 'remark-chips';
      g.options.forEach((opt) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = opt;
        chip.addEventListener('click', () => {
          if (g.single) {
            remarkSelection[g.title] = [opt];
          } else {
            if (!remarkSelection[g.title]) remarkSelection[g.title] = [];
            const arr = remarkSelection[g.title];
            const i = arr.indexOf(opt);
            if (i >= 0) arr.splice(i, 1); else arr.push(opt);
          }
          syncChipStates(chips, remarkSelection[g.title] || []);
        });
        chips.appendChild(chip);
      });
      grp.appendChild(chips);
      remarkBody.appendChild(grp);
    });
    remarkModal.classList.remove('hidden');
  }

  function syncChipStates(chipsEl, selected) {
    chipsEl.querySelectorAll('.chip').forEach((b) => {
      b.classList.toggle('active', selected.indexOf(b.textContent) >= 0);
    });
  }

  // 单菜出餐：移除订单里的某一道菜
  function serveDish(orderId, dishIndex) {
    const o = orders.find((x) => x.id === orderId);
    if (!o) return;
    const dish = o.dishes[dishIndex];
    if (!dish) return;
    o.dishes.splice(dishIndex, 1);
    if (o.dishes.length === 0) {
      // 整单菜品都出完：删除订单并释放单号、记录销售
      const oi = orders.indexOf(o);
      orders.splice(oi, 1);
      nextSeq = o.seq;
      const dishes = o.origDishes || o.dishes;
      recordSale(o.seq, o.origTotal != null ? o.origTotal : o.total, dishes);
      saveAll();
      renderOrders();
      closeOrderDetail();
      showToast('已出餐 #' + o.seq);
    } else {
      o.total = o.dishes.reduce((s, d) => s + d.price, 0);
      saveAll();
      renderOrders();
      renderOrderDetail(o);
      showToast('已出餐：' + dish.name);
    }
  }

  /* ============ 待确定订单 ============ */
  function addToPending(dish, remarks) {
    pending.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      name: dish.name,
      price: dish.price,
      remarks: remarks || [],
    });
    savePending();
    renderPending();
    showToast('已加入待确定：' + dish.name);
  }

  function removePending(id) {
    pending = pending.filter((p) => p.id !== id);
    savePending();
    renderPending();
  }

  pendingClear.addEventListener('click', () => {
    pending = [];
    savePending();
    renderPending();
    showToast('已清空待确定');
  });

  function renderPending() {
    if (pending.length === 0) {
      pendingPanel.classList.add('hidden');
      pendingList.innerHTML = '';
      return;
    }
    pendingPanel.classList.remove('hidden');
    const total = pending.reduce((s, p) => s + p.price, 0);
    confirmBtn.textContent = '确定下单（' + pending.length + ' 件 ¥' + total.toFixed(2) + '）';
    pendingList.innerHTML = '';
    pending.forEach((p) => {
      const el = document.createElement('div');
      el.className = 'pending-item';
      el.innerHTML =
        '<button class="pi-remove">×</button>' +
        '<div class="pi-name">' + p.name + '</div>' +
        (p.remarks && p.remarks.length ? '<div class="pi-remark">' + p.remarks.join('，') + '</div>' : '') +
        '<div class="pi-price">¥' + p.price.toFixed(2) + '</div>';
      el.querySelector('.pi-remove').addEventListener('click', () => removePending(p.id));
      pendingList.appendChild(el);

  }

  function confirmOrder() {
    if (pending.length === 0) {
      showToast('请先选择菜品');

    const total = pending.reduce((s, p) => s + p.price, 0);

    const dishArr = pending.map((p) => ({ name: p.name, price: p.price, remarks: p.remarks || [] }));
    orders.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      seq: seq,
      dishes: dishArr,
      origDishes: dishArr.slice(), // 整单完整菜品快照，账本记账用
      time: Date.now(),
      total: total,
      origTotal: total, // 整单完整总价，账本记账用
    });
    nextSeq += 1;
    // 最新下单的排最底下
    orders.sort((a, b) => a.time - b.time);
    pending = [];
    saveAll();
    renderPending();
    renderOrders();
    showToast('已下单 #' + seq);
  }

  /* ============ 订单列表展开/收起 ============ */
  function expandOrders() {
    orderPanel.classList.add('expanded');
    orderMask.classList.remove('hidden');
    collapseBtn.classList.remove('hidden');
    expandHint.classList.add('hidden');
  }

  function collapseOrders() {
    orderPanel.classList.remove('expanded');
    orderMask.classList.add('hidden');
    collapseBtn.classList.add('hidden');
    expandHint.classList.remove('hidden');
  }

  orderHead.addEventListener('click', () => {
    if (orderPanel.classList.contains('expanded')) collapseOrders();
    else expandOrders();
  });
  collapseBtn.addEventListener('click', collapseOrders);
  orderMask.addEventListener('click', collapseOrders);

  /* ============ 出餐 ============ */
  function serveOrder(id) {
    const idx = orders.findIndex((o) => o.id === id);
    if (idx === -1) return;
    const served = orders[idx];
    // 下一个订单号复用刚出餐这单的订单号
    nextSeq = served.seq;
    const dishes = served.origDishes || served.dishes;
    recordSale(served.seq, served.origTotal != null ? served.origTotal : served.total, dishes);
    orders.splice(idx, 1);
    saveAll();
    renderOrders();
    showToast('已出餐 #' + served.seq);
  }

  // 记录一笔销售（订单完全出餐时调用），dishes 为该单完整菜品列表
  function recordSale(seq, amount, dishes) {
    salesLog.push({
      seq: seq,
      amount: amount,
      time: Date.now(),
      items: (dishes || []).map((d) => ({ name: d.name, remarks: d.remarks || [] })),
    });
    try {
      localStorage.setItem(SALES_KEY, JSON.stringify(salesLog));
    } catch (e) { /* 忽略 */ }
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderOrders() {
    const count = orders.length;
    orderTotal.textContent = count > 0 ? '共 ' + count + ' 单' : '';
    if (count === 0) {
      orderList.innerHTML = '<div class="order-empty">暂无订单，去点几道菜吧～</div>';
      return;
    }
    orderList.innerHTML = '';
    const MAX_PREVIEW = 3; // 每单卡片最多预览几道菜
    orders.forEach((o) => {
      const preview = o.dishes.slice(0, MAX_PREVIEW);
      const moreCount = o.dishes.length - preview.length;
      let dishHtml = '';
      preview.forEach((d) => {
        dishHtml += '<div class="oi-dish">' +
          '<div class="oi-dish-name">' + d.name + '</div>' +
          (d.remarks && d.remarks.length ? '<div class="oi-remark">' + d.remarks.join('，') + '</div>' : '') +
        '</div>';
      });
      if (moreCount > 0) {
        dishHtml += '<div class="oi-more">+' + moreCount + ' 更多</div>';
      }
      const item = document.createElement('div');
      item.className = 'order-item';
      item.innerHTML =
        '<div class="oi-top">' +
          '<span class="oi-seq">#' + o.seq + '</span>' +
          '<span class="oi-time">' + formatTime(o.time) + '</span>' +
        '</div>' +
        '<div class="oi-dish-list">' + dishHtml + '</div>' +
        '<div class="oi-foot">' +
          '<span class="oi-total">¥' + o.total.toFixed(2) + '</span>' +
          '<button class="serve-btn">出餐</button>' +
        '</div>';
      item.addEventListener('click', () => openOrderDetail(o));
      item.querySelector('.serve-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        serveOrder(o.id);
      });
      orderList.appendChild(item);
    });
  }

  /* ============ 本地存储 ============ */
  function loadState() {
    try {
      orders = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) { orders = []; }
    if (!Array.isArray(orders)) orders = [];
    orders.sort((a, b) => a.time - b.time);
    // 兼容旧数据：补齐 origTotal、origDishes
    orders.forEach((o) => {
      if (typeof o.origTotal !== 'number') o.origTotal = o.total;
      if (!Array.isArray(o.origDishes)) o.origDishes = Array.isArray(o.dishes) ? o.dishes.slice() : [];
    });

    try {
      pending = JSON.parse(localStorage.getItem(PENDING_KEY)) || [];
    } catch (e) { pending = []; }
    if (!Array.isArray(pending)) pending = [];

    try {
      salesLog = JSON.parse(localStorage.getItem(SALES_KEY)) || [];
    } catch (e) { salesLog = []; }
    if (!Array.isArray(salesLog)) salesLog = [];

    nextSeq = 1;
    try {
      const n = parseInt(localStorage.getItem(SEQ_KEY), 10);
      if (!isNaN(n) && n >= 1) nextSeq = n;
    } catch (e) { nextSeq = 1; }
    // 兜底：确保 nextSeq 不与现存订单号冲突
    orders.forEach((o) => {
      if (typeof o.seq === 'number' && o.seq >= nextSeq) nextSeq = o.seq + 1;
    });
  }

  function savePending() {
    try {
      localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
    } catch (e) { /* 忽略 */ }
  }

  function saveAll() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
      localStorage.setItem(SEQ_KEY, String(nextSeq));
      localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
      localStorage.setItem(SALES_KEY, JSON.stringify(salesLog));
    } catch (e) { /* 忽略 */ }
  }

  /* ============ 总账本 ============ */
  function isToday(ts) {
    const d = new Date(ts);
    const n = new Date();
    return d.getFullYear() === n.getFullYear() &&
           d.getMonth() === n.getMonth() &&
           d.getDate() === n.getDate();
  }

  function openLedger() {
    const today = salesLog.filter((s) => isToday(s.time));
    const total = today.reduce((sum, s) => sum + s.amount, 0);
    const n = new Date();
    ledgerTitle.textContent = '总账本 · ' + (n.getMonth() + 1) + '月' + n.getDate() + '日';
    ledgerCount.textContent = today.length;
    ledgerAmount.textContent = '¥' + total.toFixed(2);
    ledgerList.innerHTML = '';
    if (today.length === 0) {
      ledgerList.innerHTML = '<div class="ledger-empty">今日暂无出餐记录</div>';
    } else {
      today.forEach((s) => {
        const row = document.createElement('div');
        row.className = 'ledger-item';
        const items = (s.items || []).map((it) =>
          it.name + (it.remarks && it.remarks.length ? '（' + it.remarks.join('、') + '）' : '')
        ).join('、');
        row.innerHTML =
          '<div class="li-head">' +
            '<span class="li-seq">#' + s.seq + '</span>' +
            '<span class="li-time">' + formatTime(s.time) + '</span>' +
            '<span class="li-amount">¥' + s.amount.toFixed(2) + '</span>' +
          '</div>' +
          '<div class="li-dishes">' + items + '</div>';
        ledgerList.appendChild(row);
      });
    }
    ledgerModal.classList.remove('hidden');
  }

  function closeLedger() {
    ledgerModal.classList.add('hidden');
    resetLedgerClearBtn();
  }
  ledgerBtn.addEventListener('click', openLedger);
  ledgerClose.addEventListener('click', closeLedger);
  ledgerModal.addEventListener('click', (e) => {
    if (e.target === ledgerModal) closeLedger();
  });

  // 清除今日账本（两步确认，防止误触）
  function resetLedgerClearBtn() {
    clearTimeout(ledgerClearTimer);
    ledgerClearTimer = null;
    ledgerClear.classList.remove('confirming');
    ledgerClear.textContent = '清除今日数据';
  }

  ledgerClear.addEventListener('click', () => {
    const today = salesLog.filter((s) => isToday(s.time));
    if (today.length === 0) {
      showToast('今日暂无数据可清除');
      return;
    }
    if (ledgerClear.classList.contains('confirming')) {
      // 二次确认：执行清除
      salesLog = salesLog.filter((s) => !isToday(s.time));
      try {
        localStorage.setItem(SALES_KEY, JSON.stringify(salesLog));
      } catch (e) { /* 忽略 */ }
      resetLedgerClearBtn();
      openLedger();
      showToast('已清除今日账本');
    } else {
      // 第一次点击：进入确认态
      ledgerClear.classList.add('confirming');
      ledgerClear.textContent = '再次点击确认清除';
      ledgerClearTimer = setTimeout(resetLedgerClearBtn, 3000);
    }
  });

  /* ============ 轻提示 ============ */
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 1200);
  }

  /* ============ 初始化 ============ */
  renderCategories();
  loadState();
  renderPending();
  renderOrders();
  showLogin();
})();
</script>
</body>
</html>
